<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>R2: Bruch-Geburt</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
        .bar { height: 2px; background: black; width: 100%; margin: 2px 0; }
        .equation { font-size: 2rem; display: flex; align-items: center; gap: 10px; }
        .loch { opacity: 0.1; border: 1px dashed red; }
    </style>
</head>
<body>
    <h3>Visualisierung: Bruch-Geburt bei (2x-1)*3 = 7</h3>
    <div class="equation">
        <span>(2x - 1)</span>
        <span class="loch">* 3</span>
        <span>=</span>
        <div class="fraction">
            <div>7</div>
            <div class="bar"></div>
            <div style="color: blue;">3</div>
        </div>
    </div>
</body>
</html>
