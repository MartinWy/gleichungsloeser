  3. Was noch zu tun ist (Die restlichen 35%)


  A. Phase P4: Das visuelle Gesetz (Priorität 1)
  Das größte offene Stück ist die absolute Positionstreue. Aktuell rutschen die Atome im Inspektor noch etwas unkontrolliert zusammen. Wir müssen das Grid-Mapping so
  bauen, dass jedes Atom seine Spalte behält – egal was links oder rechts davon passiert.


  B. Phase P2: Pfad-Algorithmus (Priorität 2)
  Aktuell "sieht" der Solver immer die erste Schale. Wir müssen einen echten Pfad-Logger bauen, der bei komplexen Termen (z.B. 5 * sqrt(x+1) = 20) den Weg zur
  Zielvariable von innen nach außen plant.


  C. Phase P3: Erweiterung (Priorität 3)
  Wir müssen die Inversions-Regeln für die "einfachen" Dinge wie Addition und Multiplikation auf den Schalen-Standard v2.0 heben (derzeit liegt der Fokus stark auf
  Wurzeln/Potenzen).


  D. Ästhetische Hygiene (Priorität 4)
  Implementierung der in Kapitel 8.6 versprochenen "Hygiene" (z.B. dass $1 \cdot x$ zu $x$ wird, ohne die UUID der Variablen zu verlieren).

